<!DOCTYPE html>
<html>

<head>
    <title>
        Positioning in html
    </title>
    <style>
        div{
            right: 20px;
        }

        div.sticky{
            position: sticky;
            top: 1px;
            left: 20px;
            width: 150px;
            border: 3px solid purple;
        }

        div.relative{
            position: relative;
            left: 50px;
            border: 4px solid black;
        }

        div.absolute{
            position: absolute;
            left: 50px;
            border: 3px solid darkblue
        }

        div.fixed{
            position: fixed;
            right: 50px;
            border: 4px solid red;
            top: 0px;
        }
    </style>
</head>

<body>
    <div class="sticky">this is a sticky property</div>
    <div class=" relative"> this is relative property
        <div class="absolute">this is absolute property</div>
    </div>
    <div class="fixed">this is fixed property</div>
</body>
