<!DOCTYPE html>
<html>
    <head>
        <title>
            Padding in html
        </title>
    </head>
    <style>
        .example1{
        width: 210px;
        background-color: blueviolet;
        padding: 10px;
        border: 0px;
        margin: 0px;
        }
        .example2{
            width:220px;
            background-color: pink;
            padding: 50px;
            border: 5px solid black;
            margin: 40px red;
        }
        hr{
            background-color: brown;
        }
    </style>
    </head>
    <body>
    <p class="example1"> Helloo </p>
    <p class="example2"> How are you?</p>
    </body>
</html>
