<!DOCTYPE html>
<html>
    <head>
        <title>
            Float and Padding in html
        </title>
    </head>
    <style>
        .example1{
        width: 210px;
        background-color: blueviolet;
        padding: 10px;
        border: 0px;
        margin: 0px;
        }
        .example2{
            width:220px;
            background-color: pink;
            padding: 50px;
            border: 5px solid black;
            margin: 40px red;
        }
        hr{
            background-color: brown;
        }
       img#flowerright{
        float: right;
       }
       img#flowerleft{
        float: left;
       }
 
    </style>
    </head>
    <body>
    <p class="example1"> Global warming </p>
    <p class="example2"> Climate change </p>
        <img id="flowerright" src="flower.jpg" style="width: 100px;">
        <img id="flowerleft" src="flower.jpg" style="width: 100px;">
        FLOWER
    </body>
</html>
